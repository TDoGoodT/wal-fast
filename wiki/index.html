<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WAL-FAST Wiki</title>
  <link rel="stylesheet" href="hljs.github-dark.min.css" />
  <script src="marked.min.js"></script>
  <script src="hljs.core.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0f14;
      --sidebar: #111418;
      --surface: #161b22;
      --border: #30363d;
      --orange: #f97316;
      --text: #e6edf3;
      --muted: #8b949e;
      --sidebar-w: 260px;
    }
    html, body { height: 100%; font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); }

    /* LAYOUT */
    .layout { display: flex; height: 100vh; }

    /* SIDEBAR */
    .sidebar {
      width: var(--sidebar-w); flex-shrink: 0;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      overflow: hidden;
      transition: transform .25s ease;
    }

    /* OVERLAY (mobile) */
    .overlay {
      display: none;
      position: fixed; inset: 0; z-index: 50;
      background: rgba(0,0,0,0.6);
    }
    .overlay.open { display: block; }
    .sidebar-header {
      padding: 1.2rem 1.2rem 1rem;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-header h1 {
      font-size: 1rem; font-weight: 700;
      font-family: monospace; color: var(--orange);
    }
    .sidebar-header p { font-size: 0.75rem; color: var(--muted); margin-top: 0.2rem; }
    .sidebar-search {
      padding: 0.8rem 1rem;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-search input {
      width: 100%; background: var(--surface); border: 1px solid var(--border);
      color: var(--text); border-radius: 6px; padding: 0.4rem 0.7rem;
      font-size: 0.82rem; outline: none;
    }
    .sidebar-search input:focus { border-color: var(--orange); }
    .nav-list { flex: 1; overflow-y: auto; padding: 0.5rem 0; }
    .nav-item {
      display: block; padding: 0.55rem 1.2rem;
      font-size: 0.85rem; color: var(--muted);
      cursor: pointer; border-left: 3px solid transparent;
      transition: all .15s; text-decoration: none;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      -webkit-tap-highlight-color: transparent;
    }
    .nav-item:hover { color: var(--text); background: rgba(255,255,255,0.04); }
    .nav-item.active { color: var(--orange); border-left-color: var(--orange); background: rgba(249,115,22,0.08); }
    .sidebar-footer {
      padding: 0.8rem 1.2rem;
      border-top: 1px solid var(--border);
      font-size: 0.72rem; color: var(--muted);
    }

    /* MAIN */
    .main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
    .toolbar {
      position: sticky; top: 0; z-index: 10;
      background: rgba(13,15,20,0.9); backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 0.7rem 2rem;
      display: flex; align-items: center; gap: 1rem;
    }
    .hamburger {
      display: none;
      background: none; border: none; color: var(--text);
      font-size: 1.3rem; cursor: pointer; padding: 0.2rem 0.5rem;
      flex-shrink: 0;
    }
    .toolbar-title { font-size: 0.9rem; font-weight: 600; }
    .toolbar-slug { font-size: 0.75rem; color: var(--muted); font-family: monospace; }

    /* MOBILE */
    @media (max-width: 640px) {
      .sidebar {
        position: fixed; top: 0; left: 0; bottom: 0;
        z-index: 60; transform: translateX(-100%);
      }
      .sidebar.open { transform: translateX(0); }
      .hamburger { display: block; }
      .toolbar { padding: 0.7rem 1rem; }
      .content { padding: 1.5rem 1rem 3rem; }
    }
    .content {
      flex: 1;
      max-width: 800px; width: 100%;
      margin: 0 auto; padding: 2.5rem 2rem 4rem;
    }

    /* MARKDOWN STYLES */
    .content h1 { font-size: 1.9rem; font-weight: 800; margin-bottom: 0.5rem; color: var(--text); }
    .content h2 { font-size: 1.3rem; font-weight: 700; margin: 2rem 0 0.75rem; padding-bottom: 0.4rem; border-bottom: 1px solid var(--border); }
    .content h3 { font-size: 1.05rem; font-weight: 700; margin: 1.5rem 0 0.5rem; color: var(--orange); }
    .content p { margin-bottom: 1rem; line-height: 1.75; color: #cdd5df; }
    .content ul, .content ol { margin: 0.5rem 0 1rem 1.5rem; }
    .content li { margin-bottom: 0.3rem; line-height: 1.7; color: #cdd5df; }
    .content code { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 0.85em; background: var(--surface); color: var(--orange); padding: 0.15em 0.4em; border-radius: 4px; }
    .content pre { margin: 1rem 0; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
    .content pre code { background: none; color: inherit; padding: 0; font-size: 0.85rem; }
    .content blockquote { border-left: 3px solid var(--orange); padding: 0.5rem 1rem; margin: 1rem 0; background: rgba(249,115,22,0.06); color: var(--muted); border-radius: 0 6px 6px 0; }
    .content table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
    .content th, .content td { padding: 0.6rem 1rem; border: 1px solid var(--border); font-size: 0.9rem; }
    .content th { background: var(--surface); font-weight: 600; }
    .content a { color: var(--orange); text-decoration: none; }
    .content a:hover { text-decoration: underline; }
    .content hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }

    /* EMPTY STATE */
    .empty { text-align: center; padding: 6rem 2rem; color: var(--muted); }
    .empty h2 { font-size: 1.4rem; margin-bottom: 0.5rem; color: var(--text); }
    .empty p { font-size: 0.9rem; }
  </style>
</head>
<body>
<div class="layout">
  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1>WAL-FAST 🔥</h1>
      <p>OCaml Learning Wiki</p>
    </div>
    <div class="sidebar-search">
      <input type="text" id="search" placeholder="Filter pages..." oninput="filterPages()" />
    </div>
    <nav class="nav-list" id="nav-list"></nav>
    <div class="sidebar-footer">Local · <span id="page-count">0</span> pages</div>
  </aside>

  <div class="main">
    <div class="toolbar">
      <button class="hamburger" onclick="openSidebar()">☰</button>
      <span class="toolbar-title" id="toolbar-title">Pick a page</span>
      <span class="toolbar-slug" id="toolbar-slug"></span>
    </div>
    <div class="content" id="content">
      <div class="empty">
        <h2>Welcome to your OCaml wiki 🪨</h2>
        <p>Pick a topic from the sidebar to start learning.</p>
      </div>
    </div>
  </div>

</div>

<script>
  marked.setOptions({ breaks: true });
  marked.use({ renderer: (() => {
    const r = new marked.Renderer();
    r.code = (code, lang) => {
      const l = lang && hljs.getLanguage(lang) ? lang : 'plaintext';
      const hi = hljs.highlight(typeof code === 'object' ? code.text : code, { language: l }).value;
      return `<pre><code class="hljs language-${l}">${hi}</code></pre>`;
    };
    return r;
  })() });

  let allPages = [], currentSlug = null;

  function openSidebar() {
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('overlay').classList.add('open');
  }
  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('overlay').classList.remove('open');
  }

  async function loadNav() {
    const res = await fetch('/api/pages');
    allPages = await res.json();
    document.getElementById('page-count').textContent = allPages.length;
    renderNav(allPages);
    // load first page by default
    if (allPages.length) loadPage(allPages[0].slug);
  }

  function renderNav(pages) {
    const nav = document.getElementById('nav-list');
    nav.innerHTML = pages.map(p =>
      `<a class="nav-item ${p.slug === currentSlug ? 'active' : ''}" href="#" onclick="event.preventDefault();loadPage('${p.slug}')">${p.title}</a>`
    ).join('');
  }

  function filterPages() {
    const q = document.getElementById('search').value.toLowerCase();
    renderNav(allPages.filter(p => p.title.toLowerCase().includes(q) || p.slug.includes(q)));
  }

  async function loadPage(slug) {
    currentSlug = slug;
    closeSidebar();
    const res = await fetch(`/api/page/${slug}`);
    const md = await res.text();
    document.getElementById('content').innerHTML = marked.parse(md);
    const page = allPages.find(p => p.slug === slug);
    document.getElementById('toolbar-title').textContent = page ? page.title : slug;
    document.getElementById('toolbar-slug').textContent = slug + '.md';
    renderNav(allPages.filter(p => {
      const q = document.getElementById('search').value.toLowerCase();
      return !q || p.title.toLowerCase().includes(q) || p.slug.includes(q);
    }));
  }

  loadNav();
</script>
</body>
</html>
